name: Release

# On demand only. Building a release on every push to main would publish
# artifacts nobody asked for and burn a tag each time.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.1.0'
        required: true
        type: string
      draft:
        description: 'Create as a draft, so it can be reviewed before publishing'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          want="${{ inputs.tag }}"
          if [ "${want#v}" != "$crate" ]; then
            echo "::error::tag ${want} does not match Cargo.toml version ${crate}"
            echo "Bump the version in Cargo.toml, or release v${crate}."
            exit 1
          fi
          echo "releasing v${crate}"

  build:
    name: ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native where a runner exists. The Intel mac is the exception: macos-13
          # was retired, and a job asking for it now sits queued forever rather than
          # failing, so the whole release hangs waiting on a runner that is never
          # coming. Apple silicon cross-compiles to x86_64 with the stock toolchain,
          # so that target is built here and simply not run.
          - os: macos-14
            target: aarch64-apple-darwin
            smoke: true
          - os: macos-14
            target: x86_64-apple-darwin
            smoke: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Only where the runner can execute what it just built. A cross-compiled
      # binary is verified by the native job for its own architecture.
      - name: Smoke test
        if: matrix.smoke
        run: B=target/${{ matrix.target }}/release/repo-metrics ./scripts/smoke.sh

      - name: Package
        run: |
          set -euo pipefail
          name="repo-metrics-${{ inputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/repo-metrics" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          mv "$name.tar.gz" dist/
          # Ubuntu ships sha256sum, macOS ships shasum; checksum from inside dist
          # so the file records a bare name rather than a build path.
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          args=(--title "${{ inputs.tag }}" --target "${{ github.sha }}" --generate-notes)
          if [ "${{ inputs.draft }}" = "true" ]; then args+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${{ inputs.tag }}" "${args[@]}" dist/*

  # A non-draft release is published here and now, so bump the tap here and now.
  # `release: published` cannot cover this case: the release above is created
  # with github.token, and GitHub does not fire workflow-triggering events for
  # anything a GITHUB_TOKEN did. A draft is covered by tap.yml instead, which
  # does fire, because a person publishes it. The two paths are exclusive, and
  # the bump is idempotent either way.
  #
  # Needs a TAP_TOKEN secret with Contents Read+Write on ryan953/homebrew-tap.
  # Without it this job fails and says so; the release still stands, and
  # `scripts/bump-formula.sh repo-metrics <version>` in the tap fixes it.
  tap:
    name: bump homebrew tap
    needs: release
    if: ${{ inputs.draft == false }}
    uses: ryan953/homebrew-tap/.github/workflows/bump.yml@main
    with:
      kind: formula
      name: repo-metrics
      version: ${{ inputs.tag }}
    secrets:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
