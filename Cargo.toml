[package]
name = "repo-metrics"
version = "0.1.0"
edition = "2021"
description = "Fast local git repository metrics and visualizations, straight from the repo"

[[bin]]
name = "repo-metrics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
